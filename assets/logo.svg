<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />

  <!-- Timeline Vertical Track -->
  <line x1="42" y1="24" x2="42" y2="104" stroke="url(#trackGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3" />

  <!-- Node 1: Historical Turn -->
  <circle cx="42" cy="36" r="6" fill="#27272a" stroke="#71717a" stroke-width="2" />
  <rect x="58" y="30" width="46" height="12" rx="4" fill="#27272a" />

  <!-- Node 2: Active Highlighted Turn (Double Marker like UI preview) -->
  <circle cx="42" cy="64" r="8" fill="url(#glowGrad)" filter="url(#shadow)" />
  <circle cx="42" cy="64" r="3.5" fill="#ffffff" />
  <!-- Marker Indicator = -->
  <rect x="58" y="58" width="52" height="12" rx="4" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2" />
  <line x1="66" y1="62" x2="82" y2="62" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <line x1="66" y1="66" x2="76" y2="66" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Node 3: Subsequent Turn -->
  <circle cx="42" cy="92" r="6" fill="#27272a" stroke="#71717a" stroke-width="2" />
  <rect x="58" y="86" width="38" height="12" rx="4" fill="#27272a" />
</svg>
