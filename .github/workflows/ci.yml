name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Cross-Platform Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: node --check sidecars/engine/main.mjs && node --check sidecars/engine/transcript.mjs && node --check sidecars/engine/test_e2e.mjs
      - name: Run Python CDP bootstrap tests
        run: python manage.py test --unit-only
